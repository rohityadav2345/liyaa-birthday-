<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#ff78a4;
    color:white;
}

.container{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* ================= SLIDES ================= */

.slide{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:25px;

    opacity:0;
    visibility:hidden;
    transform:scale(1.04);

    transition:
        opacity .7s ease,
        transform .7s ease,
        visibility .7s;
}

.slide.active{
    opacity:1;
    visibility:visible;
    transform:scale(1);
}

.slide1{
    background:linear-gradient(135deg,#ff719b,#ff9fbd,#b56be5);
}

.slide2{
    background:linear-gradient(135deg,#6c63d9,#9c70e8,#f078b0);
}

.slide3{
    background:linear-gradient(135deg,#ff8eaa,#ffb0bd,#c56fe2);
}

.slide4{
    background:linear-gradient(135deg,#704fc1,#9b63d4,#ed82b1);
}

.slide5{
    background:linear-gradient(135deg,#ff6f91,#ff9c9c,#bd69d9);
}

/* ================= TEXT ================= */

h1{
    font-size:clamp(40px,11vw,72px);
    line-height:1.05;
    margin-bottom:20px;
    text-shadow:0 5px 20px rgba(0,0,0,.18);
}

h2{
    font-size:clamp(30px,8vw,52px);
    margin-bottom:20px;
    text-shadow:0 4px 15px rgba(0,0,0,.18);
}

p{
    max-width:680px;
    font-size:clamp(17px,4.5vw,23px);
    line-height:1.6;
    text-shadow:0 2px 8px rgba(0,0,0,.12);
}

/* ================= BUTTON ================= */

.next{
    border:none;
    background:white;
    color:#df4f78;
    font-size:18px;
    font-weight:bold;
    padding:15px 30px;
    border-radius:50px;
    margin-top:25px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.next:active{
    transform:scale(.95);
}

/* ================= HEART ================= */

.heart{
    font-size:90px;
    border:none;
    background:none;
    cursor:pointer;
    margin-top:20px;
    animation:heartbeat 1.2s infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.18);
    }

    60%{
        transform:scale(1);
    }
}

/* ================= DECORATION ================= */

.star{
    position:absolute;
    font-size:25px;
    animation:sparkle 2s infinite alternate;
}

.star1{
    left:12%;
    top:18%;
}

.star2{
    right:15%;
    top:25%;
}

.star3{
    left:18%;
    bottom:20%;
}

.star4{
    right:15%;
    bottom:18%;
}

@keyframes sparkle{
    from{
        opacity:.3;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.2);
    }
}

/* ================= COUNTDOWN ================= */

.countdown{
    font-size:clamp(100px,30vw,190px);
    font-weight:bold;
    text-shadow:0 10px 30px rgba(0,0,0,.2);

    animation:
        countdownPop .8s
        cubic-bezier(.2,1.5,.4,1);
}

.countdown-title{
    font-size:clamp(24px,7vw,42px);
    margin-bottom:25px;
}
