<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Liyaa ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
}

#app {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* ---------------- PAGES ---------------- */

.page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;

    opacity: 0;
    visibility: hidden;

    transform: scale(1.05);

    transition: all 0.8s ease;
}

.page.active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    z-index: 10;
}

/* Different background for every page */

#page1 {
    background: linear-gradient(145deg, #5b176e, #ff5d9d);
}

#page2 {
    background: linear-gradient(145deg, #171b63, #6974df);
}

#page3 {
    background: linear-gradient(145deg, #7d286d, #ed6ba8);
}

#page4 {
    background: linear-gradient(145deg, #174d63, #6191d2);
}

#page5 {
    background: linear-gradient(145deg, #5c176c, #ef789d);
}

/* ---------------- TEXT ---------------- */

h1 {
    color: white;
    text-align: center;
    font-size: clamp(40px, 12vw, 75px);
    font-weight: bold;
    text-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

h2 {
    color: white;
    text-align: center;
    font-size: clamp(30px, 8vw, 55px);
    margin-bottom: 25px;
}

p {
    color: white;
    text-align: center;
    line-height: 1.7;
}

/* ---------------- BUTTON ---------------- */

button {
    margin-top: 30px;

    border: none;
    border-radius: 50px;

    padding: 15px 30px;

    color: white;
    background: linear-gradient(90deg, #ff4f9a, #ff8cc5);

    font-size: 17px;
    font-weight: bold;

    box-shadow: 0 8px 25px rgba(0,0,0,0.25);

    cursor: pointer;
}

button:active {
    transform: scale(0.92);
}

/* ---------------- HEART ---------------- */

.big-heart {
    font-size: 90px;
    margin-bottom: 20px;

    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

/* ---------------- COUNTDOWN ---------------- */

.countdown {
    font-size: 130px;
    font-weight: bold;
    color: white;

    text-shadow: 0 5px 20px rgba(0,0,0,0.3);

    animation: countPop 1s ease;
}

@keyframes countPop {
    0% {
        transform: scale(0.2);
        opacity: 0;
    }

    50% {
        transform: scale(1.2);
        opacity: 1;
    }

    100% {
        transform: scale(1);
    }
}

/* ---------------- WISHES ---------------- */

.wishes {
    width: 100%;
    max-width: 500px;

    display: flex;
    flex-direction: column;
    gap: 13px;
}

.wish {
    color: white;

    padding: 17px;

    border-radius: 20px;

    background: rgba(255,255,255,0.15);

    border: 1px solid rgba(255,255,255,0.3);

    backdrop-filter: blur(10px);

    line-height: 1.5;

    animation: wishIn 0.7s ease both;
}

.wish:nth-child(2) {
    animation-delay: 0.2s;
}

.wish:nth-child(3) {
    animation-delay: 0.4s;
}

.wish:nth-child(4) {
    animation-delay: 0.6s;
}

@keyframes wishIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------------- MESSAGE ---------------- */

.message {
    max-width: 500px;

    color: white;

    padding: 25px;

    border-radius: 25px;

    background: rgba(255,255,255,0.15);

    border: 1px solid rgba(255,255,255,0.3);

    backdrop-filter: blur(12px);

    text-align: center;

    font-size: 18px;

    line-height: 1.7;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

    width: 55px;
    height: 70px;

    border-radius: 50%;

    bottom: -100px;

    animation: balloonUp linear infinite;

    z-index: 1;
}
