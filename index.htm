/* ================= SLIDES ================= */

.slide{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    opacity:0;
    visibility:hidden;

    transform:scale(1.04);

    transition:
        opacity .7s ease,
        transform .7s ease,
        visibility .7s;
}

.slide.active{
    opacity:1;
    visibility:visible;
    transform:scale(1);
}
